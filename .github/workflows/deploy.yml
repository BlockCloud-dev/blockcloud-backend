name: Deploy with Docker Hub

on:
  push:
    branches: [ develop, main ]

env:
  DOCKER_IMAGE: leeeunda/blockcloud-server

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run tests (non-blocking)
        run: ./gradlew test || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:pr-${{ github.event.number }}
            ${{ env.DOCKER_IMAGE }}:${{ github.event.pull_request.head.sha }}
            ${{ env.DOCKER_IMAGE }}:${{ github.event.pull_request.head.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # platforms: linux/amd64  # Graviton이면 linux/arm64

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 (pull & replace container)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ env.DOCKER_IMAGE }}:${{ github.event.pull_request.head.sha }}"
            docker pull "$IMAGE"

            docker stop blockcloud-app || true
            docker rm blockcloud-app || true

            docker run -d \
              --name blockcloud-app \
              --restart unless-stopped \
              --env-file /srv/app/.env \
              -p 127.0.0.1:8080:8080 \
              "$IMAGE"

            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
                echo "UP"
                exit 0
              fi
              sleep 3
            done
            docker logs --tail=200 blockcloud-app || true
            exit 1
