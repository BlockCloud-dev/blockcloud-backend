name: PR Test
permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set CI environment variables
        run: |
          echo "CI_DATABASE_URL=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE" >> $GITHUB_ENV
          echo "CI_DATABASE_DRIVER=org.h2.Driver" >> $GITHUB_ENV
          echo "CI_DATABASE_USERNAME=sa" >> $GITHUB_ENV
          echo "CI_DATABASE_PASSWORD=" >> $GITHUB_ENV
          echo "CI_HIBERNATE_DIALECT=org.hibernate.dialect.H2Dialect" >> $GITHUB_ENV

      - name: Debug environment variables
        run: |
          echo "CI_DATABASE_URL: $CI_DATABASE_URL"
          echo "CI_DATABASE_DRIVER: $CI_DATABASE_DRIVER"
          echo "CI_DATABASE_USERNAME: $CI_DATABASE_USERNAME"
          echo "CI_HIBERNATE_DIALECT: $CI_HIBERNATE_DIALECT"

      - name: Create application.yml
        run: |
          mkdir -p src/main/resources
          mkdir -p src/test/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_YML_DEV }}" > ./src/main/resources/application-dev.yml
          echo "${{ secrets.APPLICATION_YML_PROD }}" > ./src/main/resources/application-prod.yml
          echo "${{ secrets.APPLICATION_YML_SECRET }}" > ./src/main/resources/application-secret.yml
          echo "${{ secrets.APPLICATION_YML_TEST }}" > ./src/test/resources/application.yml

      - name: Debug created files
        run: |
          echo "=== Main application.yml ==="
          cat ./src/main/resources/application.yml
          echo "=== Test application.yml ==="
          cat ./src/test/resources/application.yml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test with Gradle
        run: ./gradlew test --info

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ always() }}
        with:
          files: build/test-results/**/*.xml