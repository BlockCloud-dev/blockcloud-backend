name: PR Test
permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Create application.yml
        run: |
          mkdir -p src/main/resources
          mkdir -p src/test/resources
          echo '${{ secrets.APPLICATION_YML }}' > ./src/main/resources/application.yml
          echo '${{ secrets.APPLICATION_YML_DEV }}' > ./src/main/resources/application-dev.yml
          echo '${{ secrets.APPLICATION_YML_PROD }}' > ./src/main/resources/application-prod.yml
          echo '${{ secrets.APPLICATION_YML_SECRET }}' > ./src/main/resources/application-secret.yml
          echo '${{ secrets.APPLICATION_YML_TEST }}' > ./src/test/resources/application.yml

      - name: Debug created files
        run: |
          echo "=== Checking if files exist ==="
          ls -la src/main/resources/
          ls -la src/test/resources/
          echo "=== Main application.yml content ==="
          cat ./src/main/resources/application.yml
          echo "=== Test application.yml content ==="
          cat ./src/test/resources/application.yml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

#      - name: Test with Gradle
#        run: ./gradlew test --info
